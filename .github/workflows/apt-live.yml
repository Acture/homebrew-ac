name: Live APT source acceptance

on:
  workflow_run:
    workflows: ["Publish APT source"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  acceptance:
    if: github.event.workflow_run.conclusion == 'success'
    name: HTTPS (${{ matrix.image }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "ubuntu:24.04"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apt-repository
          path: dist/apt-site
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Install from the live HTTPS endpoint
        run: python3 packaging/apt/verify.py dist/apt-site devtunnel-service --image "$IMAGE" --uri "$APT_REPOSITORY_URI"
        env:
          IMAGE: ${{ matrix.image }}
          APT_REPOSITORY_URI: ${{ vars.APT_REPOSITORY_URI }}
